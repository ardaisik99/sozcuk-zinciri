<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#6079ce">
<meta name="description" content="Sözcükleri birbirine bağla. Kutulara yaz, bağlantıyı keşfet, zincirini tamamla.">
<title>Sözcük Zinciri</title>
$GODOT_HEAD_INCLUDE
<style>
@font-face{font-family:Nunito;src:url('__INLINE_FONT__');font-display:swap;font-weight:400 900}
*{box-sizing:border-box;scrollbar-width:none}*::-webkit-scrollbar{display:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#425fb2;color:#172967;font-family:Nunito,system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100%,450px);height:100%;height:100dvh;overflow:hidden;overflow:clip;background:#697fd3}
#canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
/* clip prevents browser focus/scroll from moving this overlay independently of Godot. */
#native-fields{position:absolute;inset:0;z-index:10;overflow:hidden;overflow:clip;pointer-events:none}
.word-input{position:absolute;pointer-events:auto;background:transparent;border:0;outline:0;box-shadow:none;color:transparent;caret-color:#6038ef;font:500 18px Nunito,system-ui,sans-serif;padding:10px 16px;min-width:0;border-radius:20px;touch-action:pan-y}
.word-input::placeholder{color:transparent}.word-input::selection{color:transparent;background:#c9bbff55}.word-input.tiles{opacity:.001;caret-color:transparent;padding:0}
#status{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:38px;text-align:center;color:white;background:#697fd3 url('__INLINE_LANDSCAPE__') center/cover no-repeat}
#status h1{font-size:58px;font-weight:900;line-height:.98;letter-spacing:-2px;margin:0 0 95px;text-shadow:0 3px 1px #303d7955}
.track{width:180px;height:6px;background:#8671cb77;border-radius:8px;overflow:hidden}#fill{height:100%;width:0;background:#fff;border-radius:8px;transition:width .2s}#detail{font-size:13px;color:#e5dcff;line-height:1.6;margin-top:15px}
#retry{border:0;border-radius:20px;background:#ffca58;color:#302074;font:900 16px Nunito;padding:14px 24px;cursor:pointer}#error{font-size:14px;line-height:1.7;max-width:320px;white-space:pre-line;color:#ffe8ac}
.desktop-note{position:fixed;left:max(40px,calc(50% - 560px));top:50%;transform:translateY(-50%);width:240px}.desktop-note small{letter-spacing:2px;font-size:11px;color:#d1d9ff;font-weight:900}.desktop-note h2{font-size:36px;line-height:1.2;letter-spacing:-1px;color:white}.desktop-note p{font-size:15px;line-height:1.8;color:#d1d9ff}
@media(max-width:1000px){.desktop-note{display:none}}@media(prefers-reduced-motion:reduce){#fill{transition:none}}
</style>
</head>
<body>
<aside class="desktop-note" aria-hidden="true"><small>BİR SÖZCÜKLE BAŞLA</small><h2>Kelimeler bağlanır.<br>Keşif başlar.</h2><p>Biraz düşün, bağlantıyı bul.<br>Gerisi zincir gibi gelir.</p></aside>
<main id="stage">
<canvas id="canvas" tabindex="0" aria-label="Sözcük Zinciri oyunu">Bu oyun WebGL 2 destekli bir tarayıcı gerektirir.</canvas>
<div id="native-fields"></div>
<div id="status" role="status" aria-live="polite"><h1>Sözcük<br>Zinciri</h1><div class="track"><div id="fill"></div></div><p id="detail">Kelimeler hazırlanıyor…</p><p id="error" hidden></p><button id="retry" hidden onclick="location.replace(location.pathname+'?v='+Date.now())">Yeniden Dene</button></div>
</main>
<script>
window.SozcukBuild={config:$GODOT_CONFIG,assets:__ASSETS_MANIFEST__};
Object.assign(window.SozcukBuild.config,{executable:'__RUNTIME_BASE__',mainPack:'__PACK_PATH__',fileSizes:__FILE_SIZES__});
</script>
<script src="__RUNTIME_JS__" defer></script>
<script src="__BOOT_JS__" defer></script>
</body></html>
