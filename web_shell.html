<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#34208d">
<meta name="description" content="Sözcükleri birbirine bağla. Kutulara yaz, bağlantıyı keşfet, zincirini tamamla.">
<title>Sözcük Zinciri</title>
$GODOT_HEAD_INCLUDE
<style>
@font-face{font-family:Nunito;src:url('Nunito.ttf');font-display:swap;font-weight:400 900}
*{box-sizing:border-box;scrollbar-width:none}*::-webkit-scrollbar{display:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1ecff;color:#292060;font-family:Nunito,system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100%,450px);height:100%;height:100dvh;overflow:hidden;background:#fffefa}
#canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
#native-fields{position:absolute;inset:0;z-index:10;overflow:hidden;pointer-events:none}
.word-input{position:absolute;pointer-events:auto;background:transparent;border:0;outline:0;box-shadow:none;color:transparent;caret-color:#6038ef;font:500 18px Nunito,system-ui,sans-serif;padding:10px 16px;min-width:0;border-radius:20px;touch-action:pan-y}
.word-input::placeholder{color:transparent}.word-input::selection{color:transparent;background:#c9bbff55}.word-input.tiles{opacity:.001;caret-color:transparent;padding:0}
#status{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:38px;text-align:center;color:white;background:#271477 url('splash.webp') center/cover no-repeat}
#status img{width:min(310px,90%);height:auto;object-fit:contain;margin:20px 0 75px}
.track{width:180px;height:6px;background:#8671cb77;border-radius:8px;overflow:hidden}#fill{height:100%;width:0;background:#fff;border-radius:8px;transition:width .2s}#detail{font-size:13px;color:#e5dcff;line-height:1.6;margin-top:15px}
#retry{border:0;border-radius:20px;background:#ffca58;color:#302074;font:900 16px Nunito;padding:14px 24px;cursor:pointer}#error{font-size:14px;line-height:1.7;max-width:320px;white-space:pre-line;color:#ffe8ac}
.desktop-note{position:fixed;left:max(40px,calc(50% - 560px));top:50%;transform:translateY(-50%);width:240px}.desktop-note small{letter-spacing:2px;font-size:11px;color:#8a76bb;font-weight:900}.desktop-note h2{font-size:36px;line-height:1.2;letter-spacing:-1px;color:#4c2bb5}.desktop-note p{font-size:15px;line-height:1.8;color:#8c7ba8}
@media(max-width:1000px){.desktop-note{display:none}}@media(prefers-reduced-motion:reduce){#fill{transition:none}}
</style>
</head>
<body>
<aside class="desktop-note" aria-hidden="true"><small>BİR SÖZCÜKLE BAŞLA</small><h2>Kelimeler bağlanır.<br>Keşif başlar.</h2><p>Biraz düşün, bağlantıyı bul.<br>Gerisi zincir gibi gelir.</p></aside>
<main id="stage">
<canvas id="canvas" tabindex="0" aria-label="Sözcük Zinciri oyunu">Bu oyun WebGL 2 destekli bir tarayıcı gerektirir.</canvas>
<div id="native-fields"></div>
<div id="status" role="status" aria-live="polite"><img src="logo_dark.webp" width="310" height="220" alt="Sözcük Zinciri"><div class="track"><div id="fill"></div></div><p id="detail">Kelimeler hazırlanıyor…</p><p id="error" hidden></p><button id="retry" hidden onclick="location.reload()">Yeniden Dene</button></div>
</main>
<script src="word-input.js?v=__BUILD_ID__"></script>
<script src="$GODOT_URL"></script>
<script>
const config=$GODOT_CONFIG;
const buildId='__BUILD_ID__';
const originalFetch=window.fetch.bind(window);
window.fetch=async function(input,options){
 const url=typeof input==='string'?input:input instanceof URL?input.href:null;
 if(url&&url.split('?')[0].endsWith('index.pck')) return originalFetch(url+'?v='+buildId,options);
 if(url&&url.split('?')[0].endsWith('index.wasm')&&'DecompressionStream'in window){try{const r=await originalFetch(url+'.gz',options);if(r.ok)return new Response(r.body.pipeThrough(new DecompressionStream('gzip')),{headers:{'Content-Type':'application/wasm'}});}catch(e){console.warn('Standart motor dosyası kullanılacak.');}}
 return originalFetch(input,options);
};
config.canvasResizePolicy=0;
const canvas=document.getElementById('canvas'),stage=document.getElementById('stage');
function fitCanvas(){const dpr=Math.min(window.devicePixelRatio||1,2),w=Math.round(stage.clientWidth*dpr),h=Math.round(stage.clientHeight*dpr);if(canvas.width!==w)canvas.width=w;if(canvas.height!==h)canvas.height=h;}
fitCanvas();new ResizeObserver(fitCanvas).observe(stage);
const engine=new Engine(config),status=document.getElementById('status'),detail=document.getElementById('detail'),fill=document.getElementById('fill');
function fail(error){document.getElementById('error').hidden=false;document.getElementById('error').textContent='Oyun yüklenemedi. Bağlantını kontrol edip tekrar dene.\n'+(error?.message||String(error));document.getElementById('retry').hidden=false;detail.textContent='Kısa bir bağlantı molası.';console.error(error);}
if(Engine.getMissingFeatures({threads:false}).length){fail(new Error('WebGL 2 ve WebAssembly desteği gerekiyor.'));}
else engine.startGame({onProgress:(loaded,total)=>{if(total>0){const p=Math.min(100,Math.round(loaded/total*100));fill.style.width=p+'%';detail.textContent=p<100?'Yükleniyor… %'+p:'Son bağlantılar kuruluyor…';}}}).then(()=>{status.remove();canvas.focus();}).catch(fail);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&document.activeElement?.tagName==='INPUT')document.activeElement.blur();});
</script>
</body></html>
