name: Godot Web · GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and small web template
        shell: bash
        run: |
          curl -fsSL https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          python3 -m pip install brotli
          python3 scripts/install_web_template.py
      - name: Import, check and export
        run: |
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit
          python3 scripts/check_project.py Godot_v4.7.2-stable_linux.x86_64
          mkdir -p web
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release Web web/index.html
          python3 scripts/package_web.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
